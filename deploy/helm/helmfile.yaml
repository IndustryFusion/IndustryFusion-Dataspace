# The dataspace on Kubernetes. See deploy/README.md for the procedure.
#
# Values are layered: values/common.yaml, then values/environments/<environment>.yaml, then the
# secrets file, which is not committed. Set DATASPACE_SECRETS_FILE to keep it somewhere else.

environments:
  default: {}
  local: {}

helmDefaults:
  wait: true
  timeout: 420
  createNamespace: false

commonLabels:
  app.kubernetes.io/part-of: dataspace

templates:
  service:
    namespace: dataspace
    chart: ./charts/dataspace
    values:
      - values/common.yaml
      - values/environments/{{ .Environment.Name }}.yaml
      - {{ env "DATASPACE_SECRETS_FILE" | default "values/secrets.yaml" }}

# Each release can only rely on the ones it needs. The first holds what every later one reads, so no
# pod waits on something a later release creates.
releases:
  - name: dataspace-common
    inherit: [{ template: service }]
    set: [{ name: component, value: common }]
  - name: dataspace-registry
    inherit: [{ template: service }]
    set: [{ name: component, value: registry }]
    needs: [dataspace-common]
  - name: dataspace-gateway
    inherit: [{ template: service }]
    set: [{ name: component, value: gateway }]
    needs: [dataspace-registry]
  - name: dataspace-dsp-gateway
    inherit: [{ template: service }]
    set: [{ name: component, value: dsp-gateway }]
    needs: [dataspace-common]
  - name: dataspace-management
    inherit: [{ template: service }]
    set: [{ name: component, value: management }]
    needs: [dataspace-registry, dataspace-gateway, dataspace-dsp-gateway]
