# The cluster from scripts/local-env.sh, whose images are loaded under dataspace/<component>:dev.
dependencies:
  s3:
    filerUrl: http://seaweedfs.iff:8888

participants:
  demo: "urn:demo:factory-owner=factory_owner,urn:demo:machine-builder=machine_builder"

ingress:
  enabled: true
  gateway:
    host: dataspace.localtest.me
  management:
    host: dataspace-management.localtest.me
    allowFrom: "0.0.0.0/0"
