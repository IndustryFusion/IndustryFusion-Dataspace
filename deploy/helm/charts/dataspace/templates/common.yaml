{{- if eq .Values.component "common" }}
apiVersion: v1
kind: Secret
metadata:
  name: service-credentials
  labels: {{- include "dataspace.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-user: {{ required "secrets.postgres.user is required" .Values.secrets.postgres.user | quote }}
  postgres-password: {{ required "secrets.postgres.password is required" .Values.secrets.postgres.password | quote }}
  s3-access-key: {{ required "secrets.s3.accessKey is required" .Values.secrets.s3.accessKey | quote }}
  s3-secret-key: {{ required "secrets.s3.secretKey is required" .Values.secrets.s3.secretKey | quote }}
  adapter-internal-key: {{ required "secrets.adapterInternalKey is required" .Values.secrets.adapterInternalKey | quote }}
  ifric-reader-client-id: {{ .Values.secrets.ifricReaderClientId | default "" | quote }}
  ifric-reader-client-secret: {{ .Values.secrets.ifricReaderClientSecret | default "" | quote }}
  admin-client-secret: {{ required "secrets.adminClientSecret is required" .Values.secrets.adminClientSecret | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: management
  labels: {{- include "dataspace.labels" . | nindent 4 }}
---
# Only what provisioning needs, and only in the participants' namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: management
  namespace: {{ .Values.namespaces.participants }}
  labels: {{- include "dataspace.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps, services]
    verbs: [get, create, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, update, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: management
  namespace: {{ .Values.namespaces.participants }}
  labels: {{- include "dataspace.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: management
subjects:
  - kind: ServiceAccount
    name: management
    namespace: {{ .Release.Namespace }}
{{- end }}
