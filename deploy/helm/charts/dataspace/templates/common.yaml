{{- if eq .Values.component "common" }}
apiVersion: v1
kind: Secret
metadata:
  name: service-credentials
  labels: {{- include "dataspace.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-user: {{ required "secrets.postgres.user is required" .Values.secrets.postgres.user | quote }}
  postgres-password: {{ required "secrets.postgres.password is required" .Values.secrets.postgres.password | quote }}
  s3-access-key: {{ required "secrets.s3.accessKey is required" .Values.secrets.s3.accessKey | quote }}
  s3-secret-key: {{ required "secrets.s3.secretKey is required" .Values.secrets.s3.secretKey | quote }}
  ifric-reader-client-id: {{ .Values.secrets.ifricReaderClientId | default "" | quote }}
  ifric-reader-client-secret: {{ .Values.secrets.ifricReaderClientSecret | default "" | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: management
  labels: {{- include "dataspace.labels" . | nindent 4 }}
---
# Only what provisioning needs, and only in the participants' namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: management
  namespace: {{ .Values.namespaces.participants }}
  labels: {{- include "dataspace.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps, services]
    verbs: [get, create, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, update, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: management
  namespace: {{ .Values.namespaces.participants }}
  labels: {{- include "dataspace.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: management
subjects:
  - kind: ServiceAccount
    name: management
    namespace: {{ .Release.Namespace }}
{{- if .Values.networkPolicy.enabled }}
{{- $component := "dataspace.industryfusion.org/component" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adapters
  namespace: {{ .Values.namespaces.participants }}
  labels: {{- include "dataspace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{ $component }}: adapter
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [gateway, management] }
        # Peers notify directly, and connectors read and push content.
        - podSelector: {}
      ports: [{ protocol: TCP, port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: connectors
  namespace: {{ .Values.namespaces.participants }}
  labels: {{- include "dataspace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{ $component }}: connector
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{ $component }}: connector
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dsp-gateway
      ports:
        - { protocol: TCP, port: 8082 }
        - { protocol: TCP, port: 8084 }
    - from:
        - podSelector:
            matchLabels:
              {{ $component }}: adapter
      ports: [{ protocol: TCP, port: 8081 }]
    - from:
        - podSelector:
            matchLabels:
              {{ $component }}: connector
      ports: [{ protocol: TCP, port: 8083 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry
  labels: {{- include "dataspace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: registry
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [gateway, management] }
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.participants }}
          podSelector:
            matchLabels:
              {{ $component }}: adapter
      ports: [{ protocol: TCP, port: 19000 }]
{{- end }}
{{- end }}
