{{- $dspEnabled := and (eq .Values.component "dsp-gateway") .Values.ingress.dspGateway.enabled }}
{{- if and .Values.ingress.enabled (or (has .Values.component (list "gateway" "management")) $dspEnabled) }}
{{- $isGateway := eq .Values.component "gateway" -}}
{{- $isDsp := eq .Values.component "dsp-gateway" -}}
{{- $settings := ternary .Values.ingress.dspGateway (ternary .Values.ingress.gateway .Values.ingress.management $isGateway) $isDsp -}}
{{- $port := ternary 8085 (ternary 8080 3000 $isGateway) $isDsp -}}
{{- $tls := .Values.ingress.tls }}
{{- $secret := ternary $tls.dspGatewaySecretName (ternary $tls.gatewaySecretName $tls.managementSecretName $isGateway) $isDsp }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.component }}
  labels: {{- include "dataspace.labels" . | nindent 4 }}
  annotations:
    {{- if $isDsp }}
    # Connectors exchange small messages here, and content goes to the gateway. The connectors authorize it.
    nginx.ingress.kubernetes.io/proxy-body-size: {{ int64 .Values.limits.maxUploadBytes | quote }}
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- else if $isGateway }}
    # Exactly the service's limit for its largest request, so an upload at the limit gets through. Smaller limits
    # are enforced by the gateway, which answers with the contract's error body.
    nginx.ingress.kubernetes.io/proxy-body-size: {{ int64 .Values.limits.maxUploadBytes | quote }}
    # Bodies stream through, as they do in the gateway, and aren't kept on the Ingress's disk.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.gateway.transferTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.gateway.transferTimeoutSeconds | quote }}
    {{- else }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ int64 .Values.limits.maxJsonBytes | quote }}
    # A registration has one deadline, and an undo after it has up to 50 seconds. See management-api.md.
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ add 60 .Values.participants.provisionReadySeconds | quote }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ required "ingress.management.allowFrom is required with the Ingress: see architecture.md" .Values.ingress.management.allowFrom | quote }}
    {{- end }}
    {{- if and $tls.enabled $tls.certManagerClusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.certManagerClusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts: [{{ required "the Ingress needs a host" $settings.host | quote }}]
      secretName: {{ $secret }}
  {{- end }}
  rules:
    - host: {{ required "the Ingress needs a host" $settings.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.component }}
                port:
                  number: {{ $port }}
{{- end }}
