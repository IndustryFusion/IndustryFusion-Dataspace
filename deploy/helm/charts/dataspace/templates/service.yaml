{{- if ne .Values.component "common" }}
{{- $ports := dict "registry" 19000 "gateway" 8080 "dsp-gateway" 8085 "management" 3000 -}}
{{- $port := required (printf "unknown component: %s" .Values.component) (get $ports .Values.component) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.component }}
  labels: {{- include "dataspace.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.component }}
  template:
    metadata:
      labels: {{- include "dataspace.labels" . | nindent 8 }}
    spec:
      {{- if eq .Values.component "registry" }}
      # A resolver sends two lookups at once, and some network plugins that enforce NetworkPolicies lose one of them.
      dnsConfig:
        options: [{ name: single-request }]
      {{- end }}
      {{- if eq .Values.component "management" }}
      serviceAccountName: management
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      containers:
        - name: {{ .Values.component }}
          image: {{ include "dataspace.image" (dict "root" . "component" .Values.component) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ $port }}
          env: {{- include (printf "dataspace.env.%s" .Values.component) . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: {{ $port }} }
            periodSeconds: 3
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.component }}
  labels: {{- include "dataspace.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.component }}
  ports:
    - port: {{ $port }}
{{- end }}
