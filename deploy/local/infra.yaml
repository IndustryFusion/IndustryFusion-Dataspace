# Local stand-ins for the platform's PostgreSQL, S3 storage and Keycloak. They use
# the platform's service names and ports, and hold data only for the pod's life.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: acid-cluster
  namespace: iff
spec:
  selector:
    matchLabels: { app: acid-cluster }
  template:
    metadata:
      labels: { app: acid-cluster }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: infra-credentials, key: postgres-user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: infra-credentials, key: postgres-password } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "dataspace"] }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: acid-cluster
  namespace: iff
spec:
  selector: { app: acid-cluster }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: iff
spec:
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          # No static list of identities: scripts/local-env.sh writes the filer's, which management keeps.
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
          ports: [{ containerPort: 8333 }, { containerPort: 8888 }]
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            tcpSocket: { port: 8333 }
            periodSeconds: 3
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: iff
spec:
  selector: { app: seaweedfs }
  ports:
    - { name: s3, port: 80, targetPort: 8333 }
    - { name: filer, port: 8888 }
---
# The filer holds every S3 identity's keys in plain text, so only management may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs
  namespace: iff
spec:
  podSelector:
    matchLabels: { app: seaweedfs }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ protocol: TCP, port: 8333 }]
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: dataspace }
          podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [management] }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: dataspace }
          podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [management] }
      ports: [{ protocol: TCP, port: 8888 }]
    # Its master, volume server and filer call each other.
    - from:
        - podSelector:
            matchLabels: { app: seaweedfs }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-service
  namespace: iff
spec:
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev"]
          ports: [{ containerPort: 8080 }]
          env:
            - { name: KC_HTTP_RELATIVE_PATH, value: /auth }
            - { name: KC_HOSTNAME, value: "http://keycloak-service.iff:8080/auth" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: infra-credentials, key: keycloak-admin-user } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: infra-credentials, key: keycloak-admin-password } }
          readinessProbe:
            httpGet: { path: /auth/health/ready, port: 9000 }
            periodSeconds: 5
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: iff
spec:
  selector: { app: keycloak }
  ports: [{ port: 8080 }]
