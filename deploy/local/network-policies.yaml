# Who reaches adapters, connectors and the registry, for the local environment. The Helm chart renders the same.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adapters
  namespace: dataspace-participants
spec:
  podSelector:
    matchLabels: { dataspace.industryfusion.org/component: adapter }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: dataspace }
          podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [gateway, management] }
        # Peers notify directly, and connectors read and push content.
        - podSelector: {}
      ports: [{ protocol: TCP, port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: connectors
  namespace: dataspace-participants
spec:
  podSelector:
    matchLabels: { dataspace.industryfusion.org/component: connector }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { dataspace.industryfusion.org/component: connector }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: dataspace }
          podSelector:
            matchLabels: { app: dsp-gateway }
      ports:
        - { protocol: TCP, port: 8082 }
        - { protocol: TCP, port: 8084 }
    - from:
        - podSelector:
            matchLabels: { dataspace.industryfusion.org/component: adapter }
      ports: [{ protocol: TCP, port: 8081 }]
    - from:
        - podSelector:
            matchLabels: { dataspace.industryfusion.org/component: connector }
      ports: [{ protocol: TCP, port: 8083 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry
  namespace: dataspace
spec:
  podSelector:
    matchLabels: { app: registry }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [gateway, management] }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: dataspace-participants }
          podSelector:
            matchLabels: { dataspace.industryfusion.org/component: adapter }
      ports: [{ protocol: TCP, port: 19000 }]
