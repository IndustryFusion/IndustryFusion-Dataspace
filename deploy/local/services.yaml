#
# The dataspace's fixed services, for the local environment. No Ingress: these are
# reachable only inside the cluster, or through a port-forward.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: dataspace
spec:
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: dataspace/registry:dev
          imagePullPolicy: Never
          ports: [{ containerPort: 19000 }]
          env:
            - { name: POSTGRES_HOST, value: acid-cluster.iff }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: service-credentials, key: postgres-user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: service-credentials, key: postgres-password } }
          readinessProbe:
            httpGet: { path: /health, port: 19000 }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: dataspace
spec:
  selector: { app: registry }
  ports: [{ port: 19000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: dataspace
spec:
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: dataspace/gateway:dev
          imagePullPolicy: Never
          ports: [{ containerPort: 8080 }]
          env:
            - { name: KEYCLOAK_URL, value: "http://keycloak-service.iff:8080/auth" }
            - { name: KEYCLOAK_REALM, value: dataspace }
            - { name: REGISTRY_URL, value: "http://registry.dataspace:19000" }
            - { name: MAX_UPLOAD_BYTES, value: "1073741824" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: dataspace
spec:
  selector: { app: gateway }
  ports: [{ port: 8080 }]
