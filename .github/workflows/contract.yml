name: Contract tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bring up the local environment
        run: scripts/local-env.sh up
      - name: Build and deploy the services
        run: scripts/local-env.sh services
      - name: Bring up the external participants
        run: python scripts/external-demo.py up
      - name: Run the suite
        run: python scripts/contract_test.py --local
      - name: Show what ran, if it failed
        if: failure()
        run: scripts/local-env.sh status
