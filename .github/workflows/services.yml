name: Services

on:
  pull_request:
    paths:
      - "gateway/**"
      - "registry/**"
      - "adapter/**"
      - "dsp-gateway/**"
      - "management/**"
      - "connector/**"
      - "scripts/**"
      - "deploy/**"
      - "helm/**"
      - ".github/workflows/services.yml"
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "registry/**"
      - "adapter/**"
      - "dsp-gateway/**"
      - "management/**"
      - "connector/**"
      - "scripts/**"
      - "deploy/**"
      - "helm/**"
      - ".github/workflows/services.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, registry, adapter, dsp-gateway, management/api]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
        env:
          TEST_POSTGRES_HOST: localhost
      - name: Build image
        run: |
          if [ "${{ matrix.service }}" = management/api ]; then
            docker build -f Dockerfile ..
          else
            docker build .
          fi

  management-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: management/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install "../api[dev]"
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npm test
        env:
          PYTHONPATH: ../api

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "ruff>=0.6,<1"
      - name: Lint
        run: ruff check --line-length 120 --select E,F,I,B,UP scripts
      - name: Check that the contract suite refuses wrong answers
        run: python scripts/contract_test.py --self-test

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The layout check renders the Pull Request's base too.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install "pyyaml>=6,<7"
          helm/bootstrap.sh tools
          echo "$PWD/helm/.tools" >> "$GITHUB_PATH"
      - name: Lint the charts
        run: |
          printf 'secrets:\n  postgres: {user: u, password: p}\n  s3: {accessKey: a, secretKey: s}\n  adminClientSecret: x\n' > "$RUNNER_TEMP/secrets.yaml"
          source helm/env.sh
          cd helm
          DATASPACE_SECRETS_FILE="$RUNNER_TEMP/secrets.yaml" helmfile -e default lint --skip-deps
      - name: Render the environment
        run: |
          source helm/env.sh
          cd helm
          DATASPACE_SECRETS_FILE="$RUNNER_TEMP/secrets.yaml" helmfile -e default template --skip-deps > /dev/null
      - name: Check what it renders
        run: python scripts/check-helm-values.py
      - name: Check the objects are the same as before the move
        run: python scripts/check-helm-layout.py --before "${{ github.event.pull_request.base.sha || github.event.before }}"

  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build connector

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install "pyyaml>=6,<7"
          helm/bootstrap.sh tools
          echo "$PWD/helm/.tools" >> "$GITHUB_PATH"
      - name: Lint the build script
        run: shellcheck scripts/build-images.sh
      - name: Test the build script
        run: python scripts/build-images-test.py
      - name: Check the names against the chart and the management API
        run: python scripts/check-image-names.py
      - name: Build every image through the script
        run: |
          source helm/env.sh
          scripts/build-images.sh --build-only
        env:
          LOCAL_REGISTRY: ci.example:5000
