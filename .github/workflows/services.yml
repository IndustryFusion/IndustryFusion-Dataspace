name: Services

on:
  pull_request:
    paths:
      - "gateway/**"
      - "registry/**"
      - "adapter/**"
      - "dsp-gateway/**"
      - "management/**"
      - "connector/**"
      - ".github/workflows/services.yml"
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "registry/**"
      - "adapter/**"
      - "dsp-gateway/**"
      - "management/**"
      - "connector/**"
      - ".github/workflows/services.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, registry, adapter, dsp-gateway, management/api]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build image
        run: docker build .

  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build connector
