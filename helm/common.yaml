# Settings shared by every installation. Override them in environment/default.yaml.
# The image names and the namespaces come from helm/env.sh, through values.yaml.gotmpl.

images:
  pullPolicy: IfNotPresent

# By default these come from the IndustryFusion DigitalTwin stack, in namespace iff.
dependencies:
  postgres:
    host: acid-cluster.iff
    port: 5432
  s3:
    endpoint: http://seaweedfs.iff:80
    # The storage's IAM API, for an S3 identity per participant. A storage started with a static list can't use this,
    # which includes the DigitalTwin stack's. Empty means participants share the identity in the secrets file. See
    # helm/README.md.
    iamUrl: ""
  keycloak:
    # Every service compares a token's issuer with <url>/realms/<realm>, so mint tokens through this URL.
    url: http://keycloak-service.iff:8080/auth
    # Optional. Without it, health looks at the realm's address.
    healthUrl: ""
    realm: dataspace

# The one place these limits are set. The services and the Ingress body sizes all read them.
limits:
  maxUploadBytes: 1073741824
  maxJsonBytes: 4194304

participants:
  # How long a whole registration may take. An undo can add up to 50 seconds, and the Ingress allows for that.
  provisionReadySeconds: 300
  # Empty means the default demo participants, the demo companies' IFRIC ids. "[]" means none. See management-api.md.
  demo: ""
  # What an externally reachable participant announces, so they must work from outside the cluster and inside it.
  # Empty means the services' addresses inside the cluster, which is enough only for peers in this cluster.
  gatewayPeerUrl: ""
  dspGatewayPeerUrl: ""
  resources:
    cpuRequest: ""
    cpuLimit: ""
    memoryRequest: ""
    memoryLimit: 2Gi

ingress:
  enabled: false
  className: nginx
  # Extra annotations, for every Ingress object. Not cert-manager's: set ingress.tls.certManagerClusterIssuer, which
  # goes on one object per TLS Secret. On both of management's, cert-manager would make two Certificates for one.
  annotations: {}
  gateway:
    host: ""
    # How long the Ingress waits on an upload or a download, in seconds.
    transferTimeoutSeconds: 3600
  # Two Ingress objects on this host: /api and /health with the Keycloak admin token, and the UI on / .
  management:
    host: ""
    # Optional. Addresses allowed to reach management, comma-separated, on both objects. Empty means any address.
    # If you set it, include external participants' adapters, as they read participants here, and make sure nginx
    # sees clients' real addresses. See helm/README.md.
    allowFrom: ""
    # A username and password in front of the UI only, from secrets.managementBasicAuth in the secrets file. /api
    # keeps the admin token. Use it with TLS.
    basicAuth:
      enabled: false
      # Per client address on the UI, as each try costs a bcrypt check: requests a second (with a burst of five
      # times as many), and open connections. Over them, nginx answers 503.
      limitRps: 5
      limitConnections: 10
  # For external participants. Hosted-only installations leave this off.
  dspGateway:
    enabled: false
    host: ""
  tls:
    enabled: false
    # Name of a cert-manager ClusterIssuer. Empty means the Secrets below already exist.
    certManagerClusterIssuer: ""
    gatewaySecretName: dataspace-gateway-tls
    managementSecretName: dataspace-management-tls
    dspGatewaySecretName: dataspace-dsp-gateway-tls

# Who reaches adapters, connectors and the registry. They need a network plugin that enforces them.
networkPolicy:
  enabled: true

# How a service's own containers are sized. Empty leaves it to the cluster.
resources: {}

# Optional. Without it, participant reads have no company details. See keycloak.md.
ifric:
  backendUrl: ""
  lookupCacheSeconds: 300
