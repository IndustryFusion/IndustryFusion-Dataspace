apiVersion: apps/v1
kind: Deployment
metadata:
  name: management
  labels: {{- include "management.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: management
  template:
    metadata:
      labels: {{- include "management.labels" . | nindent 8 }}
    spec:
      serviceAccountName: management
      containers:
        - name: management
          image: {{ include "management.image" . }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 3000
          env: {{- include "management.env" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 3
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: management
  labels: {{- include "management.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: management
  ports:
    - port: 3000
