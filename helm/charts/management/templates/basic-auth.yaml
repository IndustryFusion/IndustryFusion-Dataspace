{{- /*
  The UI login's htpasswd line, a bcrypt hash of the credentials in the secrets file. The plain password is in no
  object. Helm's htpasswd picks a new salt each time, so the hash in the cluster is kept while the credentials are
  the same: the annotation holds their SHA-256, compared with lookup. Without a cluster, as in helmfile template,
  lookup finds nothing and a new hash is written. See helm/README.md.
*/}}
{{- $settings := .Values.ingress.management -}}
{{- if and .Values.ingress.enabled $settings.basicAuth $settings.basicAuth.enabled }}
{{- $given := .Values.secrets.managementBasicAuth | default dict }}
{{- $user := required "secrets.managementBasicAuth.user is required with ingress.management.basicAuth.enabled" $given.user }}
{{- $password := required "secrets.managementBasicAuth.password is required with ingress.management.basicAuth.enabled" $given.password }}
{{- $fingerprint := printf "%s:%s" $user $password | sha256sum }}
{{- $annotation := "dataspace.industryfusion.org/credentials-sha256" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "management-basic-auth" | default dict }}
{{- $line := "" }}
{{- if and $existing.data (eq (dig "metadata" "annotations" $annotation "" $existing) $fingerprint) }}
{{- $line = index $existing.data "auth" | b64dec }}
{{- else }}
{{- $line = htpasswd $user $password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: management-basic-auth
  labels: {{- include "management.labels" . | nindent 4 }}
  annotations:
    {{ $annotation }}: {{ $fingerprint | quote }}
type: Opaque
data:
  auth: {{ $line | b64enc | quote }}
{{- end }}
