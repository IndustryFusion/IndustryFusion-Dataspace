{{- if .Values.ingress.enabled }}
{{- $settings := .Values.ingress.management -}}
{{- $tls := .Values.ingress.tls }}
{{- $secret := $tls.managementSecretName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: management
  labels: {{- include "management.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: {{ int64 .Values.limits.maxJsonBytes | quote }}
    # A registration has one deadline, and an undo after it has up to 50 seconds. See management-api.md.
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ add 60 .Values.participants.provisionReadySeconds | quote }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ required "ingress.management.allowFrom is required with the Ingress: see architecture.md" .Values.ingress.management.allowFrom | quote }}
    {{- if and $tls.enabled $tls.certManagerClusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.certManagerClusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts: [{{ required "the Ingress needs a host" $settings.host | quote }}]
      secretName: {{ $secret }}
  {{- end }}
  rules:
    - host: {{ required "the Ingress needs a host" $settings.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: management
                port:
                  number: 3000
{{- end }}
