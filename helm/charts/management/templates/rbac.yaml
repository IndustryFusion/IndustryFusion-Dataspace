apiVersion: v1
kind: ServiceAccount
metadata:
  name: management
  labels: {{- include "management.labels" . | nindent 4 }}
---
# Only what provisioning needs, and only in the participants' namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: management
  namespace: {{ .Values.namespaces.participants }}
  labels: {{- include "management.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps, services]
    verbs: [get, create, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, update, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: management
  namespace: {{ .Values.namespaces.participants }}
  labels: {{- include "management.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: management
subjects:
  - kind: ServiceAccount
    name: management
    namespace: {{ .Release.Namespace }}
