apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  labels: {{- include "registry.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels: {{- include "registry.labels" . | nindent 8 }}
    spec:
      # A resolver sends two lookups at once, and some network plugins that enforce NetworkPolicies lose one of them.
      dnsConfig:
        options: [{ name: single-request }]
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: {{ include "registry.image" . }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 19000
          env: {{- include "registry.env" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: 19000 }
            periodSeconds: 3
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  labels: {{- include "registry.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: registry
  ports:
    - port: 19000
