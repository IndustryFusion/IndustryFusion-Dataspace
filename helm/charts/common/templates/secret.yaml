apiVersion: v1
kind: Secret
metadata:
  name: service-credentials
  labels: {{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-user: {{ required "secrets.postgres.user is required" .Values.secrets.postgres.user | quote }}
  postgres-password: {{ required "secrets.postgres.password is required" .Values.secrets.postgres.password | quote }}
  s3-access-key: {{ required "secrets.s3.accessKey is required" .Values.secrets.s3.accessKey | quote }}
  s3-secret-key: {{ required "secrets.s3.secretKey is required" .Values.secrets.s3.secretKey | quote }}
  ifric-reader-client-id: {{ .Values.secrets.ifricReaderClientId | default "" | quote }}
  ifric-reader-client-secret: {{ .Values.secrets.ifricReaderClientSecret | default "" | quote }}
  admin-client-secret: {{ required "secrets.adminClientSecret is required" .Values.secrets.adminClientSecret | quote }}
