{{- if and .Values.ingress.enabled .Values.ingress.dspGateway.enabled }}
{{- $settings := .Values.ingress.dspGateway -}}
{{- $tls := .Values.ingress.tls }}
{{- $secret := $tls.dspGatewaySecretName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsp-gateway
  labels: {{- include "dsp-gateway.labels" . | nindent 4 }}
  annotations:
    # Connectors exchange small messages here, and content goes to the gateway. The connectors authorize it.
    nginx.ingress.kubernetes.io/proxy-body-size: {{ int64 .Values.limits.maxUploadBytes | quote }}
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- if and $tls.enabled $tls.certManagerClusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.certManagerClusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts: [{{ required "the Ingress needs a host" $settings.host | quote }}]
      secretName: {{ $secret }}
  {{- end }}
  rules:
    - host: {{ required "the Ingress needs a host" $settings.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsp-gateway
                port:
                  number: 8085
{{- end }}
