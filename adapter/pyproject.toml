[project]
name = "dataspace-adapter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.40,<2",
    "uvicorn[standard]>=0.30,<1",
    "asyncpg>=0.29,<1",
    "boto3>=1.34,<2",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.9,<3",
    "python-multipart>=0.0.18,<1",
    "sqlalchemy[asyncio]>=2.0.30,<3",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools]
packages = ["app", "app.routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
